name: CI

# PratiBimb CI foundation.
#
# SCOPE NOTE — read before adding jobs:
# Product code now exists: ADR-0001's CSP and ORT runtime-pin boundary landed in
# packages/security and apps/extension. Typecheck, unit tests and the ORT pin-drift
# check were added in the SAME PR that introduced that code, as this note always
# required. Perception, capture, server and executor jobs follow the same rule: they
# arrive with their code, never before it. We do not add jobs that run invented commands.
#
# LIMITATION — browser-context experiments do not run here.
# Capability spikes (S-01..S-07) require a real headful browser with a loaded MV3
# extension and a real GPU adapter. GitHub-hosted runners have no GPU and their
# software rasteriser does not answer the question we are asking. Those experiments
# are run locally and their evidence is committed under artifacts/experiments/.
# CI verifies the artifact is well-formed; it does not reproduce the measurement.
# See docs/operations/git-workflow.md §CI limitations.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance and secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verifier dependencies
        run: python -m pip install --quiet pyyaml

      - name: Verify repository governance
        run: python scripts/verify-repo.py

      # The spike-phase guard that asserted apps/ and packages/ did NOT exist is removed
      # here, deliberately and visibly, in the same PR that creates them - exactly as the
      # guard's own message instructed. It is replaced by the `product` job below, which
      # is a stronger gate: it does not merely permit product code, it verifies it.

  history:
    name: Commit and branch hygiene
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Conventional commit subjects
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # CONTRIBUTING.md section 3: one or more comma-separated lowercase scopes, no spaces.
          pattern='^(feat|fix|security|test|perf|refactor|docs|build|ci|chore|spike|revert|audit)(\([a-z0-9._/-]+(,[a-z0-9._/-]+)*\))?!?: .{1,90}$'
          bad=0
          while IFS=$'\t' read -r parents subject; do
            [ -z "$subject" ] && continue
            # A real merge commit (two or more parents) is exempt under either merge subject style.
            # A single-parent commit is never exempt, whatever its subject says.
            if [ "$(wc -w <<<"$parents")" -ge 2 ]; then
              case "$subject" in
                "Merge "*|"merge: "*) continue ;;
              esac
            fi
            if ! echo "$subject" | grep -qE "$pattern"; then
              echo "::error::non-conventional commit subject: $subject"
              bad=1
            fi
          done < <(git log --format='%P%x09%s' "$base..$head")
          [ "$bad" -eq 0 ] && echo "OK - all commit subjects are conventional."
          exit $bad

      - name: Branch name communicates intent
        run: |
          branch="${{ github.event.pull_request.head.ref }}"
          if echo "$branch" | grep -qE '^(feature|fix|security|perf|refactor|docs|ci|spike|chore)/[a-z0-9][a-z0-9-]*(/[a-z0-9-]+)*$'; then
            echo "OK - branch '$branch'"
          else
            echo "::error::branch '$branch' does not match <type>/<short-description>."
            echo "::error::See CONTRIBUTING.md section 2."
            exit 1
          fi

      - name: No large binaries introduced
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          bad=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            if [ "$size" -gt 5242880 ]; then
              echo "::error::$f is $size bytes. Model weights and large binaries are"
              echo "::error::referenced by pinned revision, never vendored. See SECURITY.md."
              bad=1
            fi
          done < <(git diff --name-only --diff-filter=ACM "$base..$head")
          [ "$bad" -eq 0 ] && echo "OK - no oversized files added."
          exit $bad

  product:
    name: Product - typecheck, unit tests, ORT pin drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install workspace
        run: npm ci --no-audit --no-fund

      # ADR-0001 G4b (constraint C-2). The pin is BUNDLE-specific: `ort.all.min.js` was
      # MEASURED to load ort-wasm-simd-threaded.jsep.wasm, not the file one would naively
      # pin. This step recomputes every hash the mapping depends on - ORT version, bundle,
      # artifact, glue - against the installed runtime, and FAILS if any has drifted.
      # A drifting bundle means the measured mapping no longer describes shipped code, so
      # the correct response is to re-run W1-S02a-2a-3, not to re-hash and carry on.
      - name: ORT pin drift (G4b / C-2)
        run: npm run pin:check

      - name: Typecheck
        run: npm run typecheck

      # ADR-0001 G4a (C-1) and G1. Every test in the security suite asserts a REFUSAL:
      # hash mismatch rejected before ORT is invoked, late pin installation rejected,
      # session creation without a pin rejected, and the capability probe never calling
      # WebAssembly.validate - the Firefox false-green trap.
      - name: Unit tests - security invariants
        run: npm test

  # ───────────────────────────────────────────────────────────────────────────────────
  # QG-02 — the coordinate contract, in real browsers.
  #
  # The gate requires a fixture rendered at DPR 1.0/1.5/2.0 and 100%/125% zoom, asserting
  # the same logical element resolves to the same CSS-pixel box in all six. The unit suite
  # cannot establish that: it supplies its own numbers, so it would agree with a wrong
  # model of DPR as readily as a right one. This job takes the numbers from the browser and
  # the frame size from a real screenshot, and runs the SHIPPED compiled code over them.
  #
  # Chromium and Firefox both run here. On the Windows workstation Firefox is NOT RUNNABLE
  # - Playwright needs its own patched build and that download fails on that network, a
  # standing environment fact recorded in agentos/blockers.md. CI is where the Firefox cell
  # is actually produced, so a green run here is the evidence for it, not a formality.
  # ───────────────────────────────────────────────────────────────────────────────────
  coordinate-contract:
    name: QG-02 - coordinate contract browser matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install workspace
        run: npm ci --no-audit --no-fund

      - name: Install Playwright ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # The gate imports packages/perception/dist, so the build must exist first. Testing a
      # re-implementation instead would test the re-implementation.
      - name: Build perception package
        run: npm run typecheck

      - name: QG-02 (${{ matrix.browser }})
        run: node tests/browser/qg02/run-qg02.mjs --browser=${{ matrix.browser }}

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qg02-${{ matrix.browser }}
          path: artifacts/gates/QG-02/

  # ───────────────────────────────────────────────────────────────────────────────────
  # T1 — detector + fusion end-to-end.
  #
  # capture -> DOM graph -> detector -> fusion -> PerceptionState, asserted against the
  # TYPED STATE rather than screenshots. A screenshot comparison would show the page
  # rendered; it would say nothing about whether provenance survived fusion, which is the
  # property this layer exists to provide.
  #
  # The detector has NO WEIGHTS. The gate asserts it REFUSES with MODEL_ASSET_UNAVAILABLE
  # rather than returning an empty list, and exercises fusion with detections derived from
  # the measured DOM boxes - which are not a detector and support no accuracy claim.
  #
  # Firefox is not runnable on the Windows workstation (Playwright's browser CDN returns
  # HTTP 400 there), so this job is where that cell is produced.
  # ───────────────────────────────────────────────────────────────────────────────────
  t1-detector-fusion:
    name: T1 - detector and fusion end-to-end
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install workspace
        run: npm ci --no-audit --no-fund

      - name: Install Playwright ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # The gate imports packages/perception/dist, so the build must exist first.
      - name: Build perception package
        run: npm run typecheck

      - name: T1 end-to-end (${{ matrix.browser }})
        run: node tests/browser/t1/run-t1.mjs --browser=${{ matrix.browser }}

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1-${{ matrix.browser }}
          path: artifacts/gates/T1-detector-fusion/

  # ───────────────────────────────────────────────────────────────────────────────────
  # QG-05 (T1 visual-context slice) — the evaluator, against a real rendered fixture.
  #
  # The unit suite validates the evaluator against geometry it generated itself, which
  # proves the arithmetic. This proves the harness works on labels derived from a browser's
  # own layout, at a real DPR, with a real screenshot's dimensions.
  #
  # NONE OF THIS IS DETECTOR PERFORMANCE. There is no detector. The perfect baseline copies
  # ground truth and scores 1.0 by construction; the gate also asserts the UIElementDetector
  # still refuses with MODEL_ASSET_UNAVAILABLE.
  # ───────────────────────────────────────────────────────────────────────────────────
  qg05-t1-evaluation:
    name: QG-05 - T1 evaluator on a real fixture
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install workspace
        run: npm ci --no-audit --no-fund

      - name: Install Playwright ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build packages
        run: npm run typecheck

      - name: QG-05 T1 evaluation (${{ matrix.browser }})
        run: node tests/browser/qg05/run-qg05.mjs --browser=${{ matrix.browser }}

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qg05-${{ matrix.browser }}
          path: artifacts/gates/QG-05-t1-evaluation/
